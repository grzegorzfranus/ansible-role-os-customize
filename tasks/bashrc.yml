---
# =============================================================================
# Ansible Role: OS Customize - Tasks: Bashrc
# =============================================================================
# Inserts a standardized shell environment block with colour support, aliases and history settings into the given .bashrc file.
# =============================================================================

- name: OS Customize | bashrc | Check for existing managed block
  become: true
  ansible.builtin.lineinfile:
    state: absent
    path: "{{ item }}"
    regexp: "{{ __os_customize_bashrc_marker }}"
  check_mode: true
  changed_when: false
  register: __os_customize_check_status

- name: OS Customize | bashrc | Insert configuration block
  become: true
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    block: |
      #
      # Enable colors
      export LS_OPTIONS='--color=auto'
      eval "$(dircolors)"
      #
      # Configure some aliases
      alias ll='ls $LS_OPTIONS -ltrha'
      alias ls='ls $LS_OPTIONS'
      alias l='ls $LS_OPTIONS -lA'
      alias rm='rm -i'
      alias cp='cp -i'
      alias mv='mv -i'
      #
      # Logging options
      HISTSIZE=10000
      HISTFILESIZE=20000
      HISTTIMEFORMAT="%h %d %H:%M:%S "
      HISTIGNORE="ls:ps:top:uptime"
      shopt -s cmdhist
    marker: "{{ __os_customize_bashrc_marker }}"
    state: present
  when: >
    __os_customize_check_status.found == 0
