---
# =============================================================================
# Ansible Role: OS Customize - Tasks: Main
# =============================================================================
# This is the main task file for the OS Customize role. It orchestrates the execution
# of all role components in the correct order. Each task is tagged appropriately
# to allow for selective execution.
#
# Flow: include_vars → assert → configure → bashrc → sysctl
# =============================================================================

# -----------------------------------------------------------------------------
# 1. OS-Specific Variables
# -----------------------------------------------------------------------------
- name: OS Customize | main | Gather OS specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
        - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_major_version'] | lower }}.yml"
        - "{{ ansible_facts['distribution'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}.yml"
        - "main.yml"
      paths:
        - "{{ role_path }}/vars"
  tags:
    - always

# -----------------------------------------------------------------------------
# 2. Variable Validation
# -----------------------------------------------------------------------------
- name: OS Customize | main | Run configuration assertions
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always
    - os_customize_validate

# -----------------------------------------------------------------------------
# 3. System Configuration
# -----------------------------------------------------------------------------
- name: OS Customize | main | Run system configuration tasks
  ansible.builtin.import_tasks: configure.yml
  tags:
    - os_customize_setup
    - os_customize_configure

# -----------------------------------------------------------------------------
# 4. Bashrc Configuration (Optional)
# -----------------------------------------------------------------------------
- name: OS Customize | main | Configure bashrc files
  when: >
    os_customize_configure_bashrc | bool
  tags:
    - os_customize_setup
    - os_customize_configure
    - os_customize_bashrc
  block:
    - name: OS Customize | main | Locate .bashrc files in home directories
      ansible.builtin.find:
        paths: "/home/"
        patterns: ".bashrc"
        recurse: true
        hidden: true
        depth: 2
      register: __os_customize_found_bashrc_files

    # Dynamic include is required here: the task file is applied once per
    # discovered .bashrc path, so tags must be propagated explicitly via
    # 'apply' — inner tasks do not inherit tags from include_tasks.
    - name: OS Customize | main | Run bashrc configuration tasks
      ansible.builtin.include_tasks:
        file: bashrc.yml
      args:
        apply:
          tags:
            - os_customize_setup
            - os_customize_configure
            - os_customize_bashrc
      loop: "{{ __os_customize_bashrc_list + __os_customize_found_bashrc_files.files | map(attribute='path') | list }}"
      loop_control:
        label: "{{ item }}"

# -----------------------------------------------------------------------------
# 5. Kernel Parameters (Optional)
# -----------------------------------------------------------------------------
- name: OS Customize | main | Run kernel parameter configuration tasks
  ansible.builtin.import_tasks: sysctl.yml
  when: >
    os_customize_configure_sysctl | bool
  tags:
    - os_customize_setup
    - os_customize_configure
    - os_customize_sysctl
