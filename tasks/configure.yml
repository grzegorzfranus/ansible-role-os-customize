---
# =============================================================================
# Ansible Role: OS Customize - Tasks: Configure
# =============================================================================
# These tasks handle the configuration of OS customization, including banner,
# login message, package installation, timezone setup, service management,
# and user group configuration.
#
# Flow:
# 1. Deploy login banner and login message script (optional)
# 2. Install additional packages (optional)
# 3. Configure system timezone (optional)
# 4. Disable motd-news.timer service (optional)
# 5. Create SSH users group (optional)
# 6. Configure APT periodic settings (optional)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Deploy Welcome Message and Login Banner (Optional)
# -----------------------------------------------------------------------------
- name: OS Customize | configure | Deploy welcome message and login banner
  become: true
  when: >
    os_customize_configure_welcome_message | bool
  block:
    - name: OS Customize | configure | Deploy welcome banner
      ansible.builtin.template:
        src: "banner.j2"
        dest: "{{ __os_customize_welcome_banner_path }}"
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: OS Customize | configure | Deploy welcome message script
      ansible.builtin.template:
        src: "scripts/login_{{ ansible_facts['os_family'] | lower }}.sh.j2"
        dest: "{{ __os_customize_welcome_script_path }}"
        owner: root
        group: root
        mode: "0644"
        backup: true

# -----------------------------------------------------------------------------
# 2. Install Additional Packages (Optional)
# -----------------------------------------------------------------------------
- name: OS Customize | configure | Install additional packages
  become: true
  ansible.builtin.package:
    name: "{{ os_customize_additional_packages }}"
    update_cache: true
    state: present
  register: __os_customize_package_result
  retries: 3
  delay: 5
  until: __os_customize_package_result is succeeded
  when: >
    os_customize_configure_additional_packages | bool

# -----------------------------------------------------------------------------
# 3. Configure System Timezone (Optional)
# -----------------------------------------------------------------------------
- name: OS Customize | configure | Configure system timezone
  when: >
    os_customize_configure_timezone | bool
  block:
    - name: OS Customize | configure | Check if timezone is available
      ansible.builtin.stat:
        path: "/usr/share/zoneinfo/{{ os_customize_timezone }}"
      register: __os_customize_timezone_file

    - name: OS Customize | configure | Assert requested timezone exists on the target
      ansible.builtin.assert:
        that:
          - __os_customize_timezone_file.stat.exists
          - not __os_customize_timezone_file.stat.isdir
        fail_msg: "❌ The timezone {{ os_customize_timezone }} is not available on this system"
        success_msg: "✅ Timezone is available on this system: {{ os_customize_timezone }}"

    - name: OS Customize | configure | Set system timezone
      become: true
      community.general.timezone:
        name: "{{ os_customize_timezone }}"
      register: __os_customize_timezone_changed

    - name: OS Customize | configure | Report timezone change
      ansible.builtin.debug:
        msg: "Timezone changed to {{ os_customize_timezone }}"
        verbosity: 1
      when: >
        __os_customize_timezone_changed.changed
      # noqa: no-handler

# -----------------------------------------------------------------------------
# 4. Disable MOTD News Service (Optional)
# -----------------------------------------------------------------------------
- name: OS Customize | configure | Disable MOTD news timer
  become: true
  when: >
    os_customize_disable_motd_news | bool
  block:
    - name: OS Customize | configure | Check if motd-news.timer exists
      ansible.builtin.stat:
        path: "/lib/systemd/system/motd-news.timer"
      register: __os_customize_motd_news_timer

    - name: OS Customize | configure | Disable, stop and mask motd-news.timer
      ansible.builtin.systemd_service:
        name: motd-news.timer
        state: stopped
        enabled: false
        masked: true
      when: >
        __os_customize_motd_news_timer.stat.exists | bool

# -----------------------------------------------------------------------------
# 5. Create SSH Users Group (Optional)
# -----------------------------------------------------------------------------
- name: OS Customize | configure | Create dedicated SSH users group
  become: true
  ansible.builtin.group:
    name: "{{ os_customize_ssh_group_name }}"
    gid: "{{ os_customize_ssh_group_gid }}"
    state: present
    system: false
  when: >
    os_customize_configure_ssh_group | bool

# -----------------------------------------------------------------------------
# 6. Configure APT Periodic Settings (Optional)
# -----------------------------------------------------------------------------
- name: OS Customize | configure | Configure APT periodic settings
  become: true
  when:
    - ansible_facts['os_family'] | lower == 'debian'
    - os_customize_configure_apt_periodic | bool
  block:
    - name: OS Customize | configure | Locate existing APT configuration files
      ansible.builtin.find:
        paths: "/etc/apt/apt.conf.d"
        file_type: file
      register: __os_customize_apt_conf_files

    - name: OS Customize | configure | Update existing APT Periodic Update-Package-Lists directives
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^\s*APT::Periodic::Update-Package-Lists\s+"[^"]*";'
        replace: 'APT::Periodic::Update-Package-Lists "{{ os_customize_apt_periodic_update_package_lists }}";'
      loop: "{{ __os_customize_apt_conf_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: OS Customize | configure | Update existing APT Periodic Unattended-Upgrade directives
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^\s*APT::Periodic::Unattended-Upgrade\s+"[^"]*";'
        replace: 'APT::Periodic::Unattended-Upgrade "{{ os_customize_apt_periodic_unattended_upgrade }}";'
      loop: "{{ __os_customize_apt_conf_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: OS Customize | configure | Enforce APT periodic update setting in 20auto-upgrades
      ansible.builtin.lineinfile:
        path: "/etc/apt/apt.conf.d/20auto-upgrades"
        regexp: '^\s*APT::Periodic::Update-Package-Lists'
        line: 'APT::Periodic::Update-Package-Lists "{{ os_customize_apt_periodic_update_package_lists }}";'
        state: present
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: OS Customize | configure | Enforce APT unattended upgrade setting in 20auto-upgrades
      ansible.builtin.lineinfile:
        path: "/etc/apt/apt.conf.d/20auto-upgrades"
        regexp: '^\s*APT::Periodic::Unattended-Upgrade'
        line: 'APT::Periodic::Unattended-Upgrade "{{ os_customize_apt_periodic_unattended_upgrade }}";'
        state: present
        create: true
        owner: root
        group: root
        mode: "0644"
