---
# =============================================================================
# Ansible Role: OS Customize - Tasks: Kernel Parameters
# =============================================================================
# This file creates the parent directory and deploys the sysctl drop-in
# configuration file to manage kernel parameters.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Ensure Kernel Parameter Drop-In Directory Exists
# -----------------------------------------------------------------------------
- name: OS Customize | sysctl | Ensure kernel parameter drop-in directory exists
  become: true
  ansible.builtin.file:
    path: "{{ os_customize_sysctl_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# -----------------------------------------------------------------------------
# 2. Deploy Managed Kernel Parameter Drop-In
# -----------------------------------------------------------------------------
- name: OS Customize | sysctl | Deploy managed kernel parameter drop-in
  become: true
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ os_customize_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: "OS Customize | handlers | Reload kernel parameters"
