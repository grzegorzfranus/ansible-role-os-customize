---
# =============================================================================
# Ansible Role: OS Customize - Molecule Preparation Playbook
# =============================================================================
# This playbook prepares the test environment for Molecule testing.
# It performs necessary system preparations before role execution:
# - Fixes file permissions
# - Installs required dependencies (tzdata, fwupd)
# - Validates system requirements
#
# Flow:
# 1. Fix system file permissions
# 2. Install timezone data
# 3. Simulate legacy APT repository setup (Debian)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. System File Permissions
# -----------------------------------------------------------------------------
- name: molecule | Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Prepare | Fix /etc/shadow permissions
      register: etc_shadow
      ansible.builtin.shell:
        cmd: |
          echo "Checking /etc/shadow permissions..."
          ls -l /etc/shadow
          chmod 0400 /etc/shadow
          echo "Fixed /etc/shadow permissions:"
          ls -l /etc/shadow
          echo ""

    - name: Prepare | Verify shadow file permissions
      ansible.builtin.debug:
        var: etc_shadow.stdout

    - name: Prepare | Ensure profile.d directory exists
      ansible.builtin.file:
        path: /etc/profile.d
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Prepare | Ensure skel directory exists
      ansible.builtin.file:
        path: /etc/skel
        state: directory
        mode: '0755'
        owner: root
        group: root

# -----------------------------------------------------------------------------
# 2. Install Timezone Data
# -----------------------------------------------------------------------------
    - name: Prepare | Install tzdata package (Debian)
      ansible.builtin.apt:
        name: tzdata
        state: present
        update_cache: true
      when: >
        ansible_facts['os_family'] == "Debian"

    - name: Prepare | Install fwupd package (Debian)
      ansible.builtin.apt:
        name: fwupd
        state: present
        update_cache: true
      when: >
        ansible_facts['os_family'] == "Debian"

    - name: Prepare | Install tzdata package (RedHat)
      ansible.builtin.dnf:
        name: tzdata
        state: present
      when: >
        ansible_facts['os_family'] == "RedHat"

# -----------------------------------------------------------------------------
# 3. Legacy APT Repository Simulation (Debian family)
# -----------------------------------------------------------------------------
    - name: Prepare | Ensure keyrings directory exists (Debian)
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: >
        ansible_facts['os_family'] == "Debian"

    - name: Prepare | Download legacy GitHub CLI keyring (Debian)
      ansible.builtin.get_url:
        url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
        dest: "/usr/share/keyrings/githubcli-archive-keyring.gpg"
        owner: root
        group: root
        mode: "0644"
      retries: 3
      delay: 5
      register: __prepare_gh_keyring
      until: __prepare_gh_keyring is succeeded
      when: >
        ansible_facts['os_family'] == "Debian"

    - name: Prepare | Deploy legacy GitHub CLI sources list (Debian)
      ansible.builtin.copy:
        dest: "/etc/apt/sources.list.d/github-cli.list"
        content: >
          deb [arch={{ _gh_arch }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
          https://cli.github.com/packages stable main
        owner: root
        group: root
        mode: "0644"
      vars:
        _gh_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ('arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture']) }}"
      when: >
        ansible_facts['os_family'] == "Debian"
