---
# =============================================================================
# Ansible Role: OS Customize - Molecule Verification Playbook
# =============================================================================
# This playbook verifies the OS customization applied by the role.
# It performs comprehensive checks of:
# - Welcome banner and login script deployment
# - Package installation
# - Timezone configuration
# - Bashrc configuration
# - SSH user group creation
# - MOTD news service and fwupd-refresh virtualization drop-in
# - APT periodic update and unattended upgrade settings
# - Kernel parameter (sysctl) drop-in file and applied values
# - systemd-networkd IPv6-off drop-in
# - Netplan default route on-link
# - Third-party APT repositories
# - Node.js runtime, npm and Corepack package managers
#
# Flow:
# 1. Load variables and gather facts
# 2. Verify banner and login script
# 3. Verify package installation
# 4. Verify timezone configuration
# 5. Verify bashrc configuration
# 6. Verify SSH group
# 7. Verify MOTD news service and fwupd-refresh drop-in
# 8. Verify APT periodic settings
# 9. Verify kernel parameters (sysctl)
# 10. Verify systemd-networkd IPv6-off drop-in
# 11. Verify netplan default route on-link
# 12. Verify third-party APT repositories
# 13. Verify Node.js, npm and Corepack
# 14. Final summary
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Environment Setup
# -----------------------------------------------------------------------------
- name: molecule | Verify Role
  hosts: all
  gather_facts: true

  vars_files:
    - ../../defaults/main.yml
    - ../../vars/main.yml

  tasks:
    - name: Verify | Gather OS specific variables
      ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
      vars:
        params:
          files:
            - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
            - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_major_version'] | lower }}.yml"
            - "{{ ansible_facts['distribution'] | lower }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}.yml"
            - "main.yml"
          paths:
            - "../../vars"

# -----------------------------------------------------------------------------
# 2. Banner and Login Script Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check if banner file exists
      ansible.builtin.stat:
        path: "{{ __os_customize_welcome_banner_path }}"
      register: _banner_result_

    - name: Verify | Assert banner file exists
      ansible.builtin.assert:
        that:
          - _banner_result_.stat.exists
        fail_msg: "Banner file not found at {{ __os_customize_welcome_banner_path }}"
        success_msg: "Banner file verified at {{ __os_customize_welcome_banner_path }}"

    - name: Verify | Check banner file permissions
      ansible.builtin.stat:
        path: "{{ __os_customize_welcome_banner_path }}"
      register: _banner_perms_

    - name: Verify | Assert banner file permissions
      ansible.builtin.assert:
        that:
          - _banner_perms_.stat.mode == "0644"
        fail_msg: "Banner file has incorrect permissions: {{ _banner_perms_.stat.mode }}"
        success_msg: "Banner file permissions verified: {{ _banner_perms_.stat.mode }}"

    - name: Verify | Check if login script exists
      ansible.builtin.stat:
        path: "{{ __os_customize_welcome_script_path }}"
      register: _script_result_

    - name: Verify | Assert login script exists
      ansible.builtin.assert:
        that:
          - _script_result_.stat.exists
        fail_msg: "Login script not found at {{ __os_customize_welcome_script_path }}"
        success_msg: "Login script verified at {{ __os_customize_welcome_script_path }}"

    - name: Verify | Check banner content contains security warning
      ansible.builtin.command:
        cmd: grep -q "AUTHORIZED ACCESS ONLY" {{ __os_customize_welcome_banner_path }}
      register: _banner_content_
      changed_when: false

    - name: Verify | Assert banner contains security warning
      ansible.builtin.assert:
        that:
          - _banner_content_.rc == 0
        fail_msg: "Banner does not contain expected security warning"
        success_msg: "Banner content verified with security warning"

# -----------------------------------------------------------------------------
# 3. Package Installation Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check if bc package is installed
      ansible.builtin.package:
        name: bc
        state: present
      check_mode: true
      register: _bc_package_

    - name: Verify | Assert bc package is installed
      ansible.builtin.assert:
        that:
          - not _bc_package_.changed
        fail_msg: "Package 'bc' is not installed"
        success_msg: "Package 'bc' verified as installed"

    - name: Verify | Check if vim package is installed
      ansible.builtin.package:
        name: vim
        state: present
      check_mode: true
      register: _vim_package_

    - name: Verify | Assert vim package is installed
      ansible.builtin.assert:
        that:
          - not _vim_package_.changed
        fail_msg: "Package 'vim' is not installed"
        success_msg: "Package 'vim' verified as installed"

# -----------------------------------------------------------------------------
# 4. Timezone Verification
# -----------------------------------------------------------------------------
    - name: Verify | Get current timezone
      ansible.builtin.command:
        cmd: timedatectl show --property=Timezone --value
      register: _timezone_result_
      changed_when: false

    - name: Verify | Assert timezone is set correctly
      ansible.builtin.assert:
        that:
          - _timezone_result_.stdout == "UTC"
        fail_msg: "Timezone is not set correctly: {{ _timezone_result_.stdout }}"
        success_msg: "Timezone verified: {{ _timezone_result_.stdout }}"

# -----------------------------------------------------------------------------
# 5. Bashrc Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check if root bashrc contains managed block
      ansible.builtin.command:
        cmd: grep -q "BEGIN ANSIBLE MANAGED BLOCK" /root/.bashrc
      register: _root_bashrc_
      changed_when: false

    - name: Verify | Assert root bashrc contains managed block
      ansible.builtin.assert:
        that:
          - _root_bashrc_.rc == 0
        fail_msg: "Root bashrc does not contain Ansible managed block"
        success_msg: "Root bashrc configuration verified"

    - name: Verify | Check if skel bashrc contains managed block
      ansible.builtin.command:
        cmd: grep -q "BEGIN ANSIBLE MANAGED BLOCK" /etc/skel/.bashrc
      register: _skel_bashrc_
      changed_when: false

    - name: Verify | Assert skel bashrc contains managed block
      ansible.builtin.assert:
        that:
          - _skel_bashrc_.rc == 0
        fail_msg: "Skel bashrc does not contain Ansible managed block"
        success_msg: "Skel bashrc configuration verified"

# -----------------------------------------------------------------------------
# 6. SSH Group Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check if SSH users group exists
      ansible.builtin.getent:
        database: group
        key: sshusers
      register: _ssh_group_

    - name: Verify | Assert SSH users group exists
      ansible.builtin.assert:
        that:
          - "'sshusers' in _ssh_group_.ansible_facts.getent_group"
        fail_msg: "SSH users group 'sshusers' does not exist"
        success_msg: "SSH users group 'sshusers' verified"

    - name: Verify | Check SSH group GID
      ansible.builtin.command:
        cmd: getent group sshusers
      register: _ssh_group_gid_
      changed_when: false

    - name: Verify | Assert SSH group has correct GID
      ansible.builtin.assert:
        that:
          - "'10000' in _ssh_group_gid_.stdout"
        fail_msg: "SSH group does not have correct GID (expected 10000)"
        success_msg: "SSH group GID verified: 10000"

# -----------------------------------------------------------------------------
# 7. MOTD News and fwupd-refresh Service Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check if motd-news.timer exists
      ansible.builtin.stat:
        path: "/lib/systemd/system/motd-news.timer"
      register: _motd_timer_exists_

    - name: Verify | Check motd-news.timer status (if exists)
      ansible.builtin.command:
        cmd: systemctl is-enabled motd-news.timer
      register: _motd_timer_status_
      changed_when: false
      failed_when: false
      when: _motd_timer_exists_.stat.exists

    - name: Verify | Assert motd-news.timer is disabled (if exists)
      ansible.builtin.assert:
        that:
          - _motd_timer_status_.stdout == "masked" or _motd_timer_status_.rc != 0
        fail_msg: "motd-news.timer is not disabled/masked"
        success_msg: "motd-news.timer verified as disabled/masked"
      when: _motd_timer_exists_.stat.exists

    - name: Verify | Check if fwupd-refresh.service exists
      ansible.builtin.stat:
        path: "/lib/systemd/system/fwupd-refresh.service"
      register: _fwupd_refresh_unit_

    - name: Verify | Check fwupd-refresh drop-in file exists
      ansible.builtin.stat:
        path: "{{ __os_customize_fwupd_refresh_dropin_path }}"
      register: _fwupd_refresh_dropin_
      when: _fwupd_refresh_unit_.stat.exists

    - name: Verify | Assert fwupd-refresh drop-in file exists
      ansible.builtin.assert:
        that:
          - _fwupd_refresh_dropin_.stat.exists
        fail_msg: "fwupd-refresh drop-in file does not exist at {{ __os_customize_fwupd_refresh_dropin_path }}"
        success_msg: "fwupd-refresh drop-in file exists at {{ __os_customize_fwupd_refresh_dropin_path }}"
      when: _fwupd_refresh_unit_.stat.exists

    - name: Verify | Read fwupd-refresh drop-in file content
      ansible.builtin.slurp:
        src: "{{ __os_customize_fwupd_refresh_dropin_path }}"
      register: _fwupd_refresh_dropin_content_
      when: _fwupd_refresh_unit_.stat.exists

    - name: Verify | Assert fwupd-refresh drop-in contains ConditionVirtualization=no
      ansible.builtin.assert:
        that:
          - "'ConditionVirtualization=no' in (_fwupd_refresh_dropin_content_.content | b64decode)"
        fail_msg: "fwupd-refresh drop-in does not contain ConditionVirtualization=no"
        success_msg: "fwupd-refresh drop-in content verified with ConditionVirtualization=no"
      when: _fwupd_refresh_unit_.stat.exists

# -----------------------------------------------------------------------------
# 8. APT Periodic Verification (Debian family)
# -----------------------------------------------------------------------------
    - name: Verify | Check APT periodic update config (Debian family)
      ansible.builtin.command:
        cmd: grep -q 'APT::Periodic::Update-Package-Lists "0";' /etc/apt/apt.conf.d/20auto-upgrades
      register: _apt_periodic_update_
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] | lower == 'debian'

    - name: Verify | Assert APT periodic update is disabled (Debian family)
      ansible.builtin.assert:
        that:
          - _apt_periodic_update_.rc == 0
        fail_msg: "APT::Periodic::Update-Package-Lists is not set to '0'"
        success_msg: "APT::Periodic::Update-Package-Lists verified as disabled ('0')"
      when: ansible_facts['os_family'] | lower == 'debian'

    - name: Verify | Check APT periodic unattended upgrade config (Debian family)
      ansible.builtin.command:
        cmd: grep -q 'APT::Periodic::Unattended-Upgrade "0";' /etc/apt/apt.conf.d/20auto-upgrades
      register: _apt_periodic_unattended_
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] | lower == 'debian'

    - name: Verify | Assert APT periodic unattended upgrade is disabled (Debian family)
      ansible.builtin.assert:
        that:
          - _apt_periodic_unattended_.rc == 0
        fail_msg: "APT::Periodic::Unattended-Upgrade is not set to '0'"
        success_msg: "APT::Periodic::Unattended-Upgrade verified as disabled ('0')"
      when: ansible_facts['os_family'] | lower == 'debian'

# -----------------------------------------------------------------------------
# 9. Kernel Parameters (sysctl) Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check if sysctl drop-in file exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/60-ansible-os-customize.conf
      register: _sysctl_file_

    - name: Verify | Assert sysctl drop-in file exists and has correct mode
      ansible.builtin.assert:
        that:
          - _sysctl_file_.stat.exists
          - _sysctl_file_.stat.mode == "0644"
        fail_msg: "Sysctl drop-in file does not exist or has incorrect mode"
        success_msg: "Sysctl drop-in file exists with mode 0644"

    - name: Verify | Read active net.ipv4.ip_forward kernel parameter
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.ip_forward
      register: _sysctl_ip_forward_
      changed_when: false

    - name: Verify | Assert net.ipv4.ip_forward is set to 0
      ansible.builtin.assert:
        that:
          - _sysctl_ip_forward_.stdout | trim == "0"
        fail_msg: "Kernel parameter net.ipv4.ip_forward is not set to 0"
        success_msg: "Kernel parameter net.ipv4.ip_forward is verified as 0"

# -----------------------------------------------------------------------------
# 10. systemd-networkd IPv6 Off Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check if systemd-networkd is active
      ansible.builtin.command:
        cmd: systemctl is-active systemd-networkd.service
      register: _networkd_active_
      changed_when: false
      failed_when: false

    - name: Verify | Query networkctl status for dummy0 in JSON format
      ansible.builtin.command:
        cmd: networkctl status --json=short dummy0
      register: _dummy0_json_status_
      changed_when: false
      failed_when: false

    - name: Verify | Determine whether dummy0 is configured by systemd-networkd
      ansible.builtin.set_fact:
        _networkd_dummy0_configured: >-
          {{
            _networkd_active_.rc == 0 and
            _dummy0_json_status_.rc == 0 and
            ('{' in _dummy0_json_status_.stdout) and
            ((_dummy0_json_status_.stdout | from_json).get('NetworkFile') == '/etc/systemd/network/10-molecule-dummy0.network')
          }}

    - name: Verify | Check if networkd IPv6-off drop-in exists
      ansible.builtin.stat:
        path: /etc/systemd/network/10-molecule-dummy0.network.d/60-ansible-os-customize.conf
      register: _networkd_dropin_
      when: >
        _networkd_dummy0_configured | bool

    - name: Verify | Assert networkd IPv6-off drop-in exists with mode 0644
      ansible.builtin.assert:
        that:
          - _networkd_dropin_.stat.exists
          - _networkd_dropin_.stat.mode == "0644"
        fail_msg: "networkd IPv6-off drop-in does not exist or has incorrect mode"
        success_msg: "networkd IPv6-off drop-in exists with mode 0644"
      when: >
        _networkd_dummy0_configured | bool

    - name: Verify | Read networkd IPv6-off drop-in file content
      ansible.builtin.slurp:
        src: /etc/systemd/network/10-molecule-dummy0.network.d/60-ansible-os-customize.conf
      register: _networkd_dropin_content_
      when: >
        _networkd_dummy0_configured | bool

    - name: Verify | Assert networkd IPv6-off drop-in contains LinkLocalAddressing=no and IPv6AcceptRA=no
      ansible.builtin.assert:
        that:
          - "'LinkLocalAddressing=no' in (_networkd_dropin_content_.content | b64decode)"
          - "'IPv6AcceptRA=no' in (_networkd_dropin_content_.content | b64decode)"
        fail_msg: "networkd IPv6-off drop-in does not contain expected directives"
        success_msg: "networkd IPv6-off drop-in verified with LinkLocalAddressing=no and IPv6AcceptRA=no"
      when: >
        _networkd_dummy0_configured | bool

    # systemd 252 and older (Debian 12, Ubuntu 22.04) do not report NetworkFileDropins.
    # The IPv6/IPv4 address assertion below covers those platforms.
    - name: Verify | Assert drop-in is listed in dummy0 NetworkFileDropins
      ansible.builtin.assert:
        that:
          - >-
            '/etc/systemd/network/10-molecule-dummy0.network.d/60-ansible-os-customize.conf'
            in (_dummy0_json_status_.stdout | from_json).get('NetworkFileDropins', [])
        fail_msg: "networkd drop-in is not listed in dummy0 NetworkFileDropins"
        success_msg: "networkd drop-in verified in dummy0 NetworkFileDropins"
      when: >
        _networkd_dummy0_configured | bool and
        'NetworkFileDropins' in (_dummy0_json_status_.stdout | from_json)

    - name: Verify | Query IPv6 addresses on dummy0
      ansible.builtin.command:
        cmd: ip -6 -o addr show dev dummy0
      register: _dummy0_ip6_
      changed_when: false
      when: >
        _networkd_dummy0_configured | bool

    - name: Verify | Query IPv4 addresses on dummy0
      ansible.builtin.command:
        cmd: ip -4 -o addr show dev dummy0
      register: _dummy0_ip4_
      changed_when: false
      when: >
        _networkd_dummy0_configured | bool

    - name: Verify | Assert dummy0 has no IPv6 address and retains IPv4 address
      ansible.builtin.assert:
        that:
          - _dummy0_ip6_.stdout | trim == ""
          - "'192.0.2.10/24' in _dummy0_ip4_.stdout"
        fail_msg: "dummy0 address state unexpected (expected no IPv6 and 192.0.2.10/24 present)"
        success_msg: "dummy0 verified without IPv6 address and with 192.0.2.10/24"
      when: >
        _networkd_dummy0_configured | bool

    - name: Verify | Check for any networkd drop-in files under /etc/systemd/network (fallback)
      ansible.builtin.find:
        paths: /etc/systemd/network
        patterns: "60-ansible-os-customize.conf"
        recurse: true
        file_type: file
      register: _fallback_networkd_dropins_
      when: >
        not _networkd_dummy0_configured | bool

    - name: Verify | Assert no networkd drop-in exists when networkd or dummy0 interface is unavailable
      ansible.builtin.assert:
        that:
          - _fallback_networkd_dropins_.matched == 0
        fail_msg: "Unexpected 60-ansible-os-customize.conf file found under /etc/systemd/network"
        success_msg: "Verified no 60-ansible-os-customize.conf drop-in exists under /etc/systemd/network"
      when: >
        not _networkd_dummy0_configured | bool

# -----------------------------------------------------------------------------
# 11. Netplan Default Route On-Link Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check if netplan binary exists
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _netplan_bin_check_
      loop:
        - /usr/sbin/netplan
        - /sbin/netplan

    - name: Verify | Determine whether netplan is present
      ansible.builtin.set_fact:
        _netplan_present: >-
          {{
            (_netplan_bin_check_.results
             | selectattr('stat.exists', 'defined')
             | selectattr('stat.exists')
             | list
             | length) > 0
          }}

    - name: Verify | Stat /etc/netplan/60-molecule.yaml
      ansible.builtin.stat:
        path: /etc/netplan/60-molecule.yaml
      register: _netplan_molecule_file_
      when: >
        _netplan_present | bool

    - name: Verify | Assert /etc/netplan/60-molecule.yaml exists and is mode 0600
      ansible.builtin.assert:
        that:
          - _netplan_molecule_file_.stat.exists
          - _netplan_molecule_file_.stat.mode == "0600"
        fail_msg: "/etc/netplan/60-molecule.yaml does not exist or has incorrect mode"
        success_msg: "/etc/netplan/60-molecule.yaml exists with mode 0600"
      when: >
        _netplan_present | bool

    - name: Verify | Read /etc/netplan/60-molecule.yaml content
      ansible.builtin.slurp:
        src: /etc/netplan/60-molecule.yaml
      register: _netplan_molecule_content_
      when: >
        _netplan_present | bool

    - name: Verify | Parse /etc/netplan/60-molecule.yaml YAML data
      ansible.builtin.set_fact:
        _netplan_molecule_data: "{{ _netplan_molecule_content_.content | b64decode | from_yaml }}"
      when: >
        _netplan_present | bool

    - name: Verify | Assert netplan parsed data structure and routes
      ansible.builtin.assert:
        that:
          - "(_netplan_molecule_data['network']['ethernets']['molecule0']['routes'] | selectattr('to', 'equalto', 'default') | first)['on-link'] is defined"
          - "(_netplan_molecule_data['network']['ethernets']['molecule0']['routes'] | selectattr('to', 'equalto', 'default') | first)['on-link'] is true"
          - "(_netplan_molecule_data['network']['ethernets']['molecule0']['routes'] | selectattr('to', 'equalto', 'default') | first)['via'] == '198.51.100.1'"
          - "(_netplan_molecule_data['network']['ethernets']['molecule0']['routes'] | selectattr('to', 'equalto', '203.0.113.0/24') | first)['on-link'] is not defined"
          - "(_netplan_molecule_data['network']['ethernets']['molecule0']['routes'] | selectattr('to', 'equalto', '203.0.113.0/24') | first)['via'] == '192.0.2.1'"
          - "_netplan_molecule_data['network']['ethernets']['molecule0']['addresses'] == ['192.0.2.20/24']"
          - "_netplan_molecule_data['network']['ethernets']['molecule0']['match']['name'] == 'molecule0'"
        fail_msg: "Netplan route configuration or interface properties do not match expectations"
        success_msg: "Netplan route on-link flag and interface properties verified successfully"
      when: >
        _netplan_present | bool

    - name: Verify | Stat /run/systemd/network/10-netplan-molecule0.network
      ansible.builtin.stat:
        path: /run/systemd/network/10-netplan-molecule0.network
      register: _netplan_rendered_file_
      when: >
        _netplan_present | bool

    - name: Verify | Assert /run/systemd/network/10-netplan-molecule0.network exists
      ansible.builtin.assert:
        that:
          - _netplan_rendered_file_.stat.exists
        fail_msg: "/run/systemd/network/10-netplan-molecule0.network does not exist"
        success_msg: "/run/systemd/network/10-netplan-molecule0.network verified as present"
      when: >
        _netplan_present | bool

    - name: Verify | Read /run/systemd/network/10-netplan-molecule0.network content
      ansible.builtin.slurp:
        src: /run/systemd/network/10-netplan-molecule0.network
      register: _netplan_rendered_content_
      when: >
        _netplan_present | bool

    - name: Verify | Assert GatewayOnLink=true appears exactly once in rendered network file
      ansible.builtin.assert:
        that:
          - (_netplan_rendered_content_.content | b64decode | regex_findall('GatewayOnLink=true') | length) == 1
        fail_msg: "GatewayOnLink=true does not appear exactly once in /run/systemd/network/10-netplan-molecule0.network"
        success_msg: "GatewayOnLink=true verified exactly once in /run/systemd/network/10-netplan-molecule0.network"
      when: >
        _netplan_present | bool

# -----------------------------------------------------------------------------
# 12. Third-Party APT Repositories Verification (Debian family)
# -----------------------------------------------------------------------------
    - name: Verify | Check if github-cli deb822 sources file exists (Debian)
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/github-cli.sources
      register: _gh_sources_file_
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert github-cli deb822 sources file exists (Debian)
      ansible.builtin.assert:
        that:
          - _gh_sources_file_.stat.exists
        fail_msg: "GitHub CLI deb822 sources file does not exist at /etc/apt/sources.list.d/github-cli.sources"
        success_msg: "GitHub CLI deb822 sources file verified at /etc/apt/sources.list.d/github-cli.sources"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Read github-cli deb822 sources file (Debian)
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/github-cli.sources
      register: _gh_sources_content_
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert github-cli deb822 source contains signed-by (Debian)
      ansible.builtin.assert:
        that:
          - "'Signed-By: /etc/apt/keyrings/githubcli-archive-keyring.gpg' in (_gh_sources_content_.content | b64decode)"
        fail_msg: "GitHub CLI deb822 source does not contain 'Signed-By: /etc/apt/keyrings/githubcli-archive-keyring.gpg'"
        success_msg: "GitHub CLI deb822 source contains expected Signed-By path"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check if legacy github-cli.list file exists (Debian)
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/github-cli.list
      register: _gh_legacy_list_
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert legacy github-cli.list file does not exist (Debian)
      ansible.builtin.assert:
        that:
          - not _gh_legacy_list_.stat.exists
        fail_msg: "Legacy file /etc/apt/sources.list.d/github-cli.list still exists"
        success_msg: "Legacy file /etc/apt/sources.list.d/github-cli.list does not exist"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check github-cli keyring file (Debian)
      ansible.builtin.stat:
        path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
      register: _gh_keyring_
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert github-cli keyring exists with mode 0644 (Debian)
      ansible.builtin.assert:
        that:
          - _gh_keyring_.stat.exists
          - _gh_keyring_.stat.mode == "0644"
        fail_msg: "GitHub CLI keyring does not exist or has incorrect mode"
        success_msg: "GitHub CLI keyring verified with mode 0644 at /etc/apt/keyrings/githubcli-archive-keyring.gpg"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Execute gh --version (Debian)
      ansible.builtin.command:
        cmd: gh --version
      register: _gh_version_
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert gh --version succeeds (Debian)
      ansible.builtin.assert:
        that:
          - _gh_version_.rc == 0
        fail_msg: "gh --version command failed"
        success_msg: "gh --version succeeded: {{ _gh_version_.stdout_lines[0] }}"
      when: ansible_facts['os_family'] == 'Debian'

# -----------------------------------------------------------------------------
# 13. Node.js, npm and Corepack Verification
# -----------------------------------------------------------------------------
    - name: Verify | Check NodeSource apt keyring (Debian)
      ansible.builtin.stat:
        path: "{{ __os_customize_nodejs_apt_keyring_path }}"
      register: _nodejs_keyring_
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert NodeSource apt keyring is deployed (Debian)
      ansible.builtin.assert:
        that:
          - _nodejs_keyring_.stat.exists
          - _nodejs_keyring_.stat.mode == "0644"
        fail_msg: "NodeSource keyring missing or has wrong permissions at {{ __os_customize_nodejs_apt_keyring_path }}"
        success_msg: "NodeSource keyring verified at {{ __os_customize_nodejs_apt_keyring_path }}"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Read NodeSource deb822 repository file (Debian)
      ansible.builtin.slurp:
        src: "/etc/apt/sources.list.d/{{ __os_customize_nodejs_apt_repo_name }}.sources"
      register: _nodejs_sources_
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert NodeSource repository targets the requested release line (Debian)
      ansible.builtin.assert:
        that:
          - "'nodistro' in (_nodejs_sources_.content | b64decode)"
          - "'node_24.x' in (_nodejs_sources_.content | b64decode)"
        fail_msg: "NodeSource deb822 repository does not target node_24.x/nodistro"
        success_msg: "NodeSource deb822 repository verified for node_24.x/nodistro"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check NodeSource apt pin (Debian)
      ansible.builtin.stat:
        path: "{{ __os_customize_nodejs_apt_preferences_path }}"
      register: _nodejs_pin_
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert NodeSource apt pin is deployed (Debian)
      ansible.builtin.assert:
        that:
          - _nodejs_pin_.stat.exists
        fail_msg: "NodeSource apt pin missing at {{ __os_customize_nodejs_apt_preferences_path }}"
        success_msg: "NodeSource apt pin verified at {{ __os_customize_nodejs_apt_preferences_path }}"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check NodeSource yum repository (RedHat)
      ansible.builtin.stat:
        path: "/etc/yum.repos.d/{{ __os_customize_nodejs_yum_repo_name }}.repo"
      register: _nodejs_yum_repo_
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify | Assert NodeSource yum repository is configured (RedHat)
      ansible.builtin.assert:
        that:
          - _nodejs_yum_repo_.stat.exists
        fail_msg: "NodeSource yum repository missing at /etc/yum.repos.d/{{ __os_customize_nodejs_yum_repo_name }}.repo"
        success_msg: "NodeSource yum repository verified"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify | Query Node.js runtime version
      ansible.builtin.command:
        cmd: "{{ __os_customize_nodejs_bin_dir }}/node --version"
      register: _nodejs_version_
      changed_when: false

    - name: Verify | Assert Node.js runtime comes from the requested release line
      ansible.builtin.assert:
        that:
          - _nodejs_version_.stdout is match('^v24\.')
        fail_msg: "Unexpected Node.js version: {{ _nodejs_version_.stdout }}"
        success_msg: "Node.js runtime verified: {{ _nodejs_version_.stdout }}"

    - name: Verify | Query npm version
      ansible.builtin.command:
        cmd: "{{ __os_customize_nodejs_bin_dir }}/npm --version"
      register: _npm_version_
      changed_when: false

    - name: Verify | Assert npm is available
      ansible.builtin.assert:
        that:
          - _npm_version_.stdout | length > 0
        fail_msg: "npm did not report a version"
        success_msg: "npm verified: {{ _npm_version_.stdout }}"

    - name: Verify | Query globally installed npm packages
      ansible.builtin.command:
        cmd: "{{ __os_customize_nodejs_bin_dir }}/npm ls --global --depth=0"
      register: _npm_global_
      changed_when: false

    - name: Verify | Assert requested global npm package is installed
      ansible.builtin.assert:
        that:
          - "'semver' in _npm_global_.stdout"
        fail_msg: "Global npm package 'semver' is not installed"
        success_msg: "Global npm package 'semver' verified"

    - name: Verify | Query Yarn version activated through Corepack
      ansible.builtin.command:
        cmd: "{{ __os_customize_nodejs_bin_dir }}/yarn --version"
      register: _yarn_version_
      changed_when: false

    - name: Verify | Assert Yarn is available through Corepack
      ansible.builtin.assert:
        that:
          - _yarn_version_.stdout | length > 0
          - _yarn_version_.stdout is version('2.0.0', '>=')
        fail_msg: >-
          Yarn reports {{ _yarn_version_.stdout }}; 'corepack prepare yarn@stable --activate' did not run,
          leaving Corepack's bundled 1.x known-good release in place
        success_msg: "Yarn verified through Corepack: {{ _yarn_version_.stdout }}"

# -----------------------------------------------------------------------------
# 14. Final Summary
# -----------------------------------------------------------------------------
    - name: Verify | Show verification results
      ansible.builtin.debug:
        msg: "All OS Customize verification checks completed successfully!"

    - name: Verify | Final verification summary
      ansible.builtin.debug:
        msg:
          - "Banner: Deployed at {{ __os_customize_welcome_banner_path }}"
          - "Login script: Deployed at {{ __os_customize_welcome_script_path }}"
          - "Packages: bc, vim installed"
          - "Timezone: UTC configured"
          - "Bashrc: Configured for root and skel"
          - "SSH group: sshusers (GID 10000) created"
          - "MOTD news: Disabled"
          - "APT periodic: Disabled"
          - "Kernel parameters: sysctl drop-in deployed, net.ipv4.ip_forward=0"
          - "systemd-networkd: IPv6-off drop-in verified"
          - "Netplan: Default route on-link verified (where netplan exists)"
          - "APT repositories: github-cli deb822 source and keyring verified (Debian)"
          - "Node.js: Runtime, npm and Corepack verified"
          - "OS Customize role verification: PASSED"
