---
# =============================================================================
# Ansible Role: OS Customize - Argument Specifications
# =============================================================================
# Declarative input specifications for static role variable validation.
# =============================================================================

argument_specs:
  main:
    short_description: "Customize Linux OS settings, banners, login scripts, and shell environment."
    description:
      - "This role customizes basic Linux OS settings, including login banners, welcome messages,"
      - "shell environment, timezone, and package installation across Debian, Ubuntu, and EL systems."
    author:
      - "Grzegorz Franus"
    options:
      os_customize_system_admin_mail:
        type: str
        default: "admin@example.com"
        description: "System administrator e-mail address used in banners and notifications."

      os_customize_configure_timezone:
        type: bool
        default: false
        description: "Enable or disable timezone configuration."

      os_customize_timezone:
        type: str
        default: "Europe/Warsaw"
        description: "Timezone to set on the target system (e.g. 'Europe/Warsaw', 'UTC')."

      os_customize_configure_additional_packages:
        type: bool
        default: true
        description: "Enable or disable installation of additional packages."

      os_customize_additional_packages:
        type: list
        elements: str
        default:
          - bc
          - vim
          - nano
        description: "List of additional system packages to install."

      os_customize_configure_welcome_message:
        type: bool
        default: true
        description: "Enable or disable deployment of welcome message script and login banner."

      os_customize_configure_bashrc:
        type: bool
        default: true
        description: "Enable or disable configuration of .bashrc files for root and users."

      os_customize_disable_motd_news:
        type: bool
        default: true
        description: "Enable or disable stopping and masking of the motd-news.timer systemd service."

      os_customize_configure_ssh_group:
        type: bool
        default: true
        description: "Enable or disable creation of a dedicated SSH users group."

      os_customize_ssh_group_name:
        type: str
        default: "sshusers"
        description: "Name of the dedicated SSH users group."

      os_customize_ssh_group_gid:
        type: int
        default: 10000
        description: "Numerical GID for the dedicated SSH users group."

      os_customize_configure_apt_periodic:
        type: bool
        default: true
        description: "Enable or disable configuration of APT periodic update and upgrade settings."

      os_customize_apt_periodic_update_package_lists:
        type: str
        default: "0"
        description: "Setting for APT::Periodic::Update-Package-Lists ('0' to disable, '1' to enable)."

      os_customize_apt_periodic_unattended_upgrade:
        type: str
        default: "0"
        description: "Setting for APT::Periodic::Unattended-Upgrade ('0' to disable, '1' to enable)."

      os_customize_configure_sysctl:
        type: bool
        default: false
        description: "Enable or disable management of kernel parameters through a sysctl drop-in file."

      os_customize_sysctl_file:
        type: str
        default: "/etc/sysctl.d/60-ansible-os-customize.conf"
        description: "Absolute path of the drop-in file the role manages under /etc/sysctl.d/."

      os_customize_sysctl_settings:
        type: dict
        default: {}
        description: "Mapping of kernel parameter name to value, written in the order given."

      os_customize_configure_nodejs:
        type: bool
        default: false
        description: "Enable or disable installation of Node.js from the official NodeSource repository."

      os_customize_nodejs_major_version:
        type: str
        default: "24"
        description: "Major Node.js release line to track, mapped to the NodeSource 'node_<major>.x' repository."

      os_customize_nodejs_version:
        type: str
        default: ""
        description: "Exact NodeSource package version to pin, or an empty string for the newest build in the major line."

      os_customize_nodejs_package_state:
        type: str
        default: "present"
        choices:
          - present
          - latest
        description: "Package state applied to the nodejs package."

      os_customize_nodejs_apt_repo_base_uri:
        type: str
        default: "https://deb.nodesource.com"
        description: "Base URI of the NodeSource APT repository, overridable for an internal mirror."

      os_customize_nodejs_apt_key_url:
        type: str
        default: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
        description: "URL of the ASCII-armored NodeSource signing key used by APT."

      os_customize_nodejs_yum_repo_base_uri:
        type: str
        default: "https://rpm.nodesource.com"
        description: "Base URI of the NodeSource RPM repository used on the Enterprise Linux family."

      os_customize_nodejs_yum_key_url:
        type: str
        default: "https://rpm.nodesource.com/gpgkey/ns-operations-public.key"
        description: "URL of the NodeSource signing key used by DNF/YUM."

      os_customize_nodejs_apt_pin:
        type: bool
        default: true
        description: "Enable or disable the APT pin giving NodeSource packages priority over the distribution's nodejs package."

      os_customize_nodejs_apt_pin_priority:
        type: int
        default: 600
        description: "APT pin priority applied to packages originating from the NodeSource repository."

      os_customize_configure_npm:
        type: bool
        default: false
        description: "Enable or disable npm management; requires os_customize_configure_nodejs."

      os_customize_npm_version:
        type: str
        default: ""
        description: "Global npm version to install, or an empty string to keep the npm bundled with the nodejs package."

      os_customize_npm_global_packages:
        type: list
        elements: dict
        default: []
        description: "Global npm packages to install."
        options:
          name:
            type: str
            required: true
            description: "Name of the npm package."
          version:
            type: str
            description: "Optional exact version of the npm package."

      os_customize_configure_corepack:
        type: bool
        default: false
        description: "Enable or disable Corepack shims; requires os_customize_configure_nodejs and a Node.js major version below 25."

      os_customize_corepack_packages:
        type: list
        elements: dict
        default:
          - name: "yarn"
            version: "stable"
        description: "Package managers activated through 'corepack prepare <name>@<version> --activate'."
        options:
          name:
            type: str
            required: true
            description: "Name of the package manager, for example 'yarn' or 'pnpm'."
          version:
            type: str
            required: true
            description: "Version or dist-tag passed to corepack, for example 'stable'."
