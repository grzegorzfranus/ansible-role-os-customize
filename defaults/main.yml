---
# =============================================================================
# Ansible Role: OS Customize - Default Variables
# =============================================================================
# This file defines default configuration values for the OS Customize role.
# These values can be overridden in your playbook or inventory.
#
# Supported OS distributions:
# - Ubuntu 26.04 (Resolute) and variants
# - Ubuntu 24.04 (Noble) and variants
# - Ubuntu 22.04 (Jammy) and variants
# - Debian 13 (Trixie) and variants
# - Debian 12 (Bookworm) and variants
# - Debian 11 (Bullseye) and variants
# - EL9: Rocky Linux 9, RHEL 9, AlmaLinux 9, CentOS Stream 9
#
# Sections:
#   1. General Settings
#   2. Timezone Configuration
#   3. Additional Packages
#   4. Welcome Message and Banner
#   5. Bashrc Configuration
#   6. MOTD News Configuration
#   7. SSH User Group Configuration
#   8. APT Periodic Configuration
#   9. Kernel Parameters (sysctl)
#   10. Node.js Runtime (NodeSource)
#   11. npm Package Manager
#   12. Corepack Package Managers (Yarn, pnpm)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. General Settings
# -----------------------------------------------------------------------------
# Role execution control and basic service configuration

# System administrator e-mail address (used in banners, notifications, etc.)
# Valid values: e-mail address string
os_customize_system_admin_mail: "admin@example.com"

# -----------------------------------------------------------------------------
# 2. Timezone Configuration
# -----------------------------------------------------------------------------
# Enable/disable timezone configuration
# Valid values: true, false
os_customize_configure_timezone: false

# Timezone to set on the system (e.g., "Europe/Warsaw")
# Valid values: IANA timezone identifier string e.g. Europe/Warsaw
os_customize_timezone: "Europe/Warsaw"

# -----------------------------------------------------------------------------
# 3. Additional Packages
# -----------------------------------------------------------------------------
# Enable/disable installation of additional packages
# Valid values: true, false
os_customize_configure_additional_packages: true

# List of additional packages to install
# Valid values: list of package name strings
os_customize_additional_packages:
  - bc
  - vim
  - nano

# -----------------------------------------------------------------------------
# 4. Welcome Message and Banner
# -----------------------------------------------------------------------------
# Enable/disable configuration of welcome message and login banner
# Valid values: true, false
os_customize_configure_welcome_message: true

# -----------------------------------------------------------------------------
# 5. Bashrc Configuration
# -----------------------------------------------------------------------------
# Enable/disable configuration of .bashrc files
# Valid values: true, false
os_customize_configure_bashrc: true

# -----------------------------------------------------------------------------
# 6. MOTD News Configuration
# -----------------------------------------------------------------------------
# Enable/disable disabling of motd-news.timer service
# Valid values: true, false
os_customize_disable_motd_news: true

# -----------------------------------------------------------------------------
# 7. SSH User Group Configuration
# -----------------------------------------------------------------------------
# Enable/disable creation of a dedicated SSH users group
# Valid values: true, false
os_customize_configure_ssh_group: true

# Name of the SSH users group
# Valid values: group name string
os_customize_ssh_group_name: "sshusers"

# GID for the SSH users group (high number to avoid conflicts)
# Valid values: integer between 1000 and 65534
os_customize_ssh_group_gid: 10000

# -----------------------------------------------------------------------------
# 8. APT Periodic Configuration
# -----------------------------------------------------------------------------
# Enable/disable configuration of APT periodic update and upgrade settings
# Valid values: true, false
os_customize_configure_apt_periodic: true

# APT periodic update package lists setting ("0" to disable, "1" to enable)
# Valid values: "0" (disabled), "1" (enabled)
os_customize_apt_periodic_update_package_lists: "0"

# APT periodic unattended upgrade setting ("0" to disable, "1" to enable)
# Valid values: "0" (disabled), "1" (enabled)
os_customize_apt_periodic_unattended_upgrade: "0"

# -----------------------------------------------------------------------------
# 9. Kernel Parameters (sysctl)
# -----------------------------------------------------------------------------
# Enable/disable management of kernel parameters through a sysctl drop-in file
# Valid values: true, false
os_customize_configure_sysctl: false

# Path of the drop-in file the role manages. Kept under /etc/sysctl.d/ and namespaced so the
# role never edits /etc/sysctl.conf or a drop-in owned by another tool.
# Valid values: absolute file path string under /etc/sysctl.d/
os_customize_sysctl_file: "/etc/sysctl.d/60-ansible-os-customize.conf"

# Kernel parameters to apply, as a mapping of parameter name to value.
# Settings are written in the order given. Order matters for interface-scoped parameters:
# the 'all' scope acts as a master switch applied to every interface, so a caller keeping
# loopback IPv6 must list net.ipv6.conf.lo.disable_ipv6 after net.ipv6.conf.all.disable_ipv6.
# Valid values: mapping of kernel parameter name to value string
os_customize_sysctl_settings: {}

# -----------------------------------------------------------------------------
# 10. Node.js Runtime (NodeSource)
# -----------------------------------------------------------------------------
# Enable/disable installation of Node.js from the official NodeSource repository
# Valid values: true, false
os_customize_configure_nodejs: false

# Major Node.js release line to track, mapped to the NodeSource 'node_<major>.x' repository
# Valid values: numeric string, e.g. "20", "22", "24"
os_customize_nodejs_major_version: "24"

# Exact package version to pin. Empty string installs the newest build in the selected major line.
# Valid values: "" or a NodeSource package version, e.g. "24.20.0-1nodesource1"
os_customize_nodejs_version: ""

# Package state applied to the nodejs package
# Valid values: "present", "latest"
os_customize_nodejs_package_state: "present"

# Base URI of the NodeSource APT repository. Override to point at an internal mirror.
# Valid values: http(s) URL without a trailing slash
os_customize_nodejs_apt_repo_base_uri: "https://deb.nodesource.com"

# URL of the ASCII-armored NodeSource signing key used by APT
# Valid values: http(s) URL to an ASCII-armored GPG key
os_customize_nodejs_apt_key_url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"

# Base URI of the NodeSource RPM repository used on the Enterprise Linux family
# Valid values: http(s) URL without a trailing slash
os_customize_nodejs_yum_repo_base_uri: "https://rpm.nodesource.com"

# URL of the NodeSource signing key used by DNF/YUM
# Valid values: http(s) URL to a GPG key
os_customize_nodejs_yum_key_url: "https://rpm.nodesource.com/gpgkey/ns-operations-public.key"

# Enable/disable the APT pin giving NodeSource packages priority over the distribution's nodejs package
# Valid values: true, false
os_customize_nodejs_apt_pin: true

# APT pin priority applied to packages originating from the NodeSource repository
# Valid values: integer between 1 and 1000
os_customize_nodejs_apt_pin_priority: 600

# -----------------------------------------------------------------------------
# 11. npm Package Manager
# -----------------------------------------------------------------------------
# Enable/disable npm management. Requires os_customize_configure_nodejs to be enabled.
# Valid values: true, false
os_customize_configure_npm: false

# Global npm version to install. Empty string keeps the npm bundled with the nodejs package.
# Valid values: "", "latest" or an exact npm version, e.g. "11.6.0"
os_customize_npm_version: ""

# Global npm packages to install, each entry a mapping with a required 'name' and an optional 'version'
# Valid values: list of mappings, e.g. [{name: "pnpm", version: "10.0.0"}]
os_customize_npm_global_packages: []

# -----------------------------------------------------------------------------
# 12. Corepack Package Managers (Yarn, pnpm)
# -----------------------------------------------------------------------------
# Enable/disable Corepack shims. Requires os_customize_configure_nodejs and a Node.js major
# version below 25, because Node.js 25 no longer bundles the corepack binary.
# Valid values: true, false
os_customize_configure_corepack: false

# Package managers activated through Corepack, each entry a mapping with a required 'name'
# and a required 'version' passed to 'corepack prepare <name>@<version> --activate'
# Valid values: list of mappings, e.g. [{name: "yarn", version: "stable"}]
os_customize_corepack_packages:
  - name: "yarn"
    version: "stable"
